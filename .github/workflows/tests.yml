name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[examples]"
      - run: python -m unittest discover -s tests -v
      - run: python "parameters with range - advance/run.py" --seed 42 --generations 2
      - name: Installed module smoke test outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from GA import GeneticAlgorithm; ga = GeneticAlgorithm(lambda x, e: sum(x), 1, [(0, 1)], seed=42); assert ga.run(0, verbose=False)[1] >= 0"
