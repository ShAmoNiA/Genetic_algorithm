[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shamonia-genetic-algorithm"
version = "0.1.0"
description = "A small bounded-real genetic algorithm with reproducible runs"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
examples = ["PyYAML>=6,<7"]

[tool.setuptools]
py-modules = ["GA"]
package-dir = {"" = "parameters with range - advance"}
